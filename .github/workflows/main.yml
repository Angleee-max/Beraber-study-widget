
name: Build Beraber Widget

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q beraber_phone_build_package.zip -d package
          unzip -q package/beraber_phone_build/beraber_study_widget_source.zip -d source

      - name: Build APK
        working-directory: source/beraber_widget
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: study-widget-apk
          path: source/beraber_widget/app/build/outputs/apk/debug/app-debug.apk
          
